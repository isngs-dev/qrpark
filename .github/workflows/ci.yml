name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
        working-directory: backend

      # Schema validity needs no database connection, so a bad schema is
      # caught here before anything touches the service containers below.
      - run: npx prisma validate
        working-directory: backend
        env:
          DATABASE_URL: postgresql://unused:unused@localhost:5432/unused

      - run: npx prisma generate
        working-directory: backend

      # Copied from eparking .github/workflows/ci.yml. Two things at once: the
      # migrations apply cleanly to an empty database through the same command
      # a deploy uses, and the database they produce still matches
      # schema.prisma. A schema edit without a migration makes the diff exit 2,
      # which is what keeps docs/schema.md and the database honest.
      #
      # No shadow database: the diff reads the live database the migrations
      # were just applied to. The raw-SQL rules (CHECKs, the partial unique
      # index, the audit trigger) do not register as drift.
      - name: Migrations apply and match the schema
        working-directory: backend
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code && echo "schema and migrations agree"
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # The database tests need the migrated database above, and both servers
      # up: they fail rather than skip without them. The HTTP tests commit
      # rows, which is fine on this throwaway container (CI=true lets them run
      # on a database not named *_test). Each test file sets its own
      # JWT_SECRET and SITE_CODE.
      - run: npm test
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          REDIS_URL: redis://localhost:6379

      - run: npx nest build
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
        working-directory: admin
      - run: npm run build
        working-directory: admin

  # Sprint 4c: the Android JVM tests (the app's rule files and the release
  # rules in build-logic). No emulator, no signing, no secrets. Every action is
  # pinned to a release tag. The repo has no Gradle wrapper, so Gradle 8.9 (the
  # version AGP 8.7.3 needs) comes from setup-gradle.
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          # versionCode is the commit count: a shallow clone would make it 1.
          fetch-depth: 0

      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '21'

      # The runner image ships an Android SDK at $ANDROID_HOME; this makes sure
      # the platform and build-tools the app needs are there, licences accepted.
      - name: Android SDK platform 35 and build-tools 34.0.0
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" --install "platforms;android-35" "build-tools;34.0.0" > /dev/null
          "$SDKM" --list_installed | grep -E 'platforms;android-35|build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4.3.1
        with:
          gradle-version: '8.9'

      - name: App JVM tests
        run: gradle -p android :app:testDebugUnitTest --console=plain

      - name: Release-rule tests (build-logic)
        run: gradle -p android/build-logic test --console=plain

# Local development only. Host ports 5433 / 6380 so this stack can run beside
# eparking's (5432 / 6379).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qrpark
      POSTGRES_PASSWORD: qrpark
      POSTGRES_DB: qrpark
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qrpark"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
